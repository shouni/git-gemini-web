{{define "content"}}
<section class="py-4">
    <div class="d-flex align-items-center mb-3">
        <i class="bi bi-robot h3 me-2 text-primary"></i>
        <h1 class="h3 mb-0">AIコードレビュー依頼フォーム</h1>
    </div>

    {{if .Error}}
    <div class="alert alert-danger shadow-sm d-flex align-items-center" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <div><strong>エラーが発生しました:</strong> {{.Error}}</div>
    </div>
    {{end}}

    {{if .Message}}
    <div class="alert alert-success shadow-sm" role="alert">
        <h4 class="alert-heading text-success fw-bold"><i class="bi bi-check-circle-fill me-2"></i>成功</h4>
        <p class="mb-0">{{.Message}}</p>
        {{if .ResultURL}}
        <hr>
        <p class="mb-2"><strong>結果URL:</strong></p>
        <a href="{{.ResultURL}}" class="btn btn-outline-success btn-sm" target="_blank" rel="noopener noreferrer">
            <i class="bi bi-file-earmark-text me-1"></i>レビュー結果をこちらから確認
        </a>
        <div class="mt-2 text-muted small"><i class="bi bi-shield-lock me-1"></i>※セキュリティのため、URLは一定時間後に無効になります。</div>
        {{end}}
    </div>
    {{end}}

    <form action="/submit_review" method="POST" id="reviewForm" class="card p-4 shadow-sm border-0">
        <input type="hidden" name="gorilla.csrf.Token" value="{{.CSRFToken}}">

        <div class="mb-3">
            <label for="repo_url" class="form-label fw-bold text-secondary">リポジトリURL (SSH/HTTPS)</label>
            <input type="text" id="repo_url" name="repo_url" class="form-control"
                   placeholder="例: https://github.com/user/repo.git"
                   pattern="{{.RepoURLPattern}}"
                   title="有効なGitリポジトリURL (https://, ssh://, git@) を入力してください。"
                   required>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="base_branch" class="form-label fw-bold text-secondary">ベースブランチ (比較元)</label>
                <input type="text" id="base_branch" name="base_branch" class="form-control"
                       value="main" pattern="{{.BranchPattern}}"
                       title="有効なブランチ名を入力してください。" required>
            </div>
            <div class="col-md-6">
                <label for="feature_branch" class="form-label fw-bold text-secondary">フィーチャーブランチ (比較対象)</label>
                <input type="text" id="feature_branch" name="feature_branch" class="form-control"
                       value="develop" pattern="{{.BranchPattern}}"
                       title="有効なブランチ名を入力してください。" required>
            </div>
        </div>

        <div class="mb-4">
            <label for="review_mode" class="form-label fw-bold text-secondary">レビューモード</label>
            <select id="review_mode" name="review_mode" class="form-select" required>
                <option value="detail">detail (詳細な品質レビュー)</option>
                <option value="release">release (リリース可否判定)</option>
            </select>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
            <i class="bi bi-cpu-fill me-2"></i>レビュー開始 (Queue Job)
        </button>
    </form>

    <div class="mt-4 p-3 bg-light border-start border-4 border-primary rounded shadow-sm">
        <p class="mb-0 small text-muted">
            <i class="bi bi-info-circle-fill me-1"></i>
            <strong>注意:</strong> このリクエストはバックエンドのCloud Tasksに非同期でキューイングされ、処理完了後に結果がGCSに保存されます。
        </p>
    </div>
</section>

<script>
    (function() {
        const submitBtn = document.getElementById('submitBtn');
        const reviewForm = document.getElementById('reviewForm');
        const baseBranchInput = document.getElementById('base_branch');
        const featureBranchInput = document.getElementById('feature_branch');

        function validateBranchInput(input) {
            const value = input.value || '';
            if (value.includes('..') || value.includes('//')) {
                input.setCustomValidity("'..' または '//' は使用できません。");
                return false;
            }
            if (value.endsWith('/') || value.endsWith('.')) {
                input.setCustomValidity("末尾に '/' や '.' は使用できません。");
                return false;
            }
            input.setCustomValidity('');
            return true;
        }

        baseBranchInput.addEventListener('input', () => validateBranchInput(baseBranchInput));
        featureBranchInput.addEventListener('input', () => validateBranchInput(featureBranchInput));

        reviewForm.onsubmit = function(event) {
            const baseOK = validateBranchInput(baseBranchInput);
            const featureOK = validateBranchInput(featureBranchInput);
            if (!baseOK || !featureOK || !reviewForm.checkValidity()) {
                event.preventDefault();
                reviewForm.reportValidity();
                return;
            }
            // 即時無効化を避けるためsetTimeoutを使用
            setTimeout(() => {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>送信中...';
            }, 0);
        };

        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-cpu-fill me-2"></i>レビュー開始 (Queue Job)';
            }
        });
    })();
</script>
{{end}}
