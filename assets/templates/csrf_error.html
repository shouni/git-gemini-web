{{define "content"}}
<section class="py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 text-center">
            <div class="card shadow-sm border-0 p-4">
                <div class="card-body">
                    <div class="mb-4">
                        <i class="bi bi-shield-exclamation text-warning" style="font-size: 4rem;"></i>
                    </div>

                    <h1 class="h3 mb-3 fw-bold">セッションが無効です</h1>

                    <div class="alert alert-light border-0 bg-light mb-4">
                        <p class="mb-2 text-secondary">
                            セキュリティ保護のため、フォームの送信がブロックされました。
                        </p>
                        <ul class="text-start d-inline-block small text-muted">
                            <li>フォームの有効期限が切れた</li>
                            <li>ページを長時間開いたままにしていた</li>
                            <li>ブラウザの戻るボタンを使用した</li>
                        </ul>
                    </div>

                    <p class="mb-4 text-secondary">
                        ページを<strong>再読み込み</strong>してから、再度お試しください。
                    </p>

                    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                        <a href="" class="btn btn-primary px-4 fw-bold">
                            <i class="bi bi-arrow-clockwise me-1"></i>再読み込み
                        </a>
                        <a href="/" class="btn btn-outline-secondary px-4">
                            <i class="bi bi-house-door me-1"></i>Homeに戻る
                        </a>
                    </div>
                </div>
            </div>

            <div class="mt-4 text-muted small">
                <i class="bi bi-info-circle me-1"></i>
                Cookieが有効になっていない場合、このエラーが繰り返し発生することがあります。
            </div>
        </div>
    </div>
</section>
{{end}}
