<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIコードレビューランナー</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 50px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #0056b3;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .note {
            margin-top: 20px;
            padding: 10px;
            background-color: #f0f8ff;
            border-left: 4px solid #007bff;
            color: #333;
            font-size: 0.9em;
        }
        .error-message {
            padding: 15px;
            margin-bottom: 20px;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
        }
        .success-message {
            padding: 15px;
            margin-bottom: 20px;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div class="container">

    {{if .Error}}
    <div class="error-message">
        <strong>エラーが発生しました:</strong> {{.Error}}
    </div>
    {{end}}

    {{if .Message}}
    <div class="success-message">
        <p><strong>成功:</strong> {{.Message}}</p>
        {{if .ResultURL}}
        <p><strong>結果URL:</strong> <a href="{{.ResultURL}}" target="_blank" rel="noopener noreferrer">レビュー結果をこちらから確認</a></p>
        {{end}}
    </div>
    {{end}}

    <h1>🤖 AIコードレビュー依頼フォーム</h1>

    <form action="/submit_review" method="POST" id="reviewForm">
        <input type="hidden" name="gorilla.csrf.Token" value="{{.CSRFToken}}">

        <label for="repo_url">リポジトリURL (SSH/HTTPS)</label>
        <input type="text" id="repo_url" name="repo_url"
               placeholder="例: https://github.com/user/repo.git"
               pattern="^(https?|git|ssh):\/\/.*\.git$|^git@.*:.*\.git$"
               title="有効なGitリポジトリURL (https://, ssh://, git@) を入力してください。"
               required>

        <label for="base_branch">ベースブランチ (比較元)</label>
        <input type="text" id="base_branch" name="base_branch"
               value="main"
               pattern="^(?!.*\.\.)[\w.-]+(/[\w.-]+)*$"
               title="有効なブランチ名を入力してください。"
               required>

        <label for="feature_branch">フィーチャーブランチ (比較対象)</label>
        <input type="text" id="feature_branch" name="feature_branch"
               value="develop"
               pattern="^(?!.*\.\.)[\w.-]+(/[\w.-]+)*$"
               title="有効なブランチ名を入力してください。"
               required>

        <label for="review_mode">レビューモード</label>
        <select id="review_mode" name="review_mode" required>
            <option value="detail">detail (詳細な品質レビュー)</option>
            <option value="release">release (リリース可否判定)</option>
        </select>

        <button type="submit" id="submitBtn">レビュー開始 (Cloud Tasksにキューイング)</button>
    </form>

    <div class="note">
        <p><strong>注意:</strong> このリクエストはバックエンドのCloud Tasksに非同期でキューイングされ、処理完了後に結果がGCSに保存されます。</p>
    </div>
</div>

<script>
    const submitBtn = document.getElementById('submitBtn');
    document.getElementById('reviewForm').onsubmit = function() {
        submitBtn.disabled = true;
        submitBtn.innerText = '送信中...';
    };

    // ブラウザバック時のボタン復帰対策
    window.addEventListener('pageshow', function(event) {
        if (event.persisted) {
            submitBtn.disabled = false;
            submitBtn.innerText = 'レビュー開始 (Cloud Tasksにキューイング)';
        }
    });
</script>
</body>
</html>
